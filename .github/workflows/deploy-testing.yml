name: Deploy Testing

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/johnrios07/telemetry-one-backend
          tags: |
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=sha,prefix=develop-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT || '22' }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # Pass GITHUB_TOKEN to remote so docker login can authenticate to GHCR
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            DEPLOY_DIR="/opt/telemetry-one/backend"
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown "$USER:$USER" "$DEPLOY_DIR"

            cat > "$DEPLOY_DIR/compose.testing.yaml" << 'COMPOSE'
            services:
              telemetry-one-backend:
                image: ghcr.io/johnrios07/telemetry-one-backend:develop
                container_name: telemetry-one-backend
                restart: unless-stopped
                env_file: .env
                ports:
                  - "8081:8080"
                healthcheck:
                  test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
                  interval: 30s
                  timeout: 5s
                  start_period: 10s
                  retries: 3
            COMPOSE

            if [ ! -f "$DEPLOY_DIR/.env" ]; then
              cat > "$DEPLOY_DIR/.env" << 'ENV'
            TELEMETRY_ONE_ENV=testing
            TELEMETRY_ONE_ADDR=:8080
            TELEMETRY_ONE_AI_PROVIDER=fake
            TELEMETRY_ONE_AI_MODEL=gpt-4o-mini
            ENV
            fi

            cd "$DEPLOY_DIR"
            # Auth to GHCR via stdin so token never appears in process list
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker compose -f compose.testing.yaml pull
            docker compose -f compose.testing.yaml up -d

            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1; then
                echo "Health check OK"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed after 60s"
            exit 1
