services:
  telemetry-one-backend:
    image: ghcr.io/johnrios07/telemetry-one-backend:develop
    container_name: telemetry-one-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
