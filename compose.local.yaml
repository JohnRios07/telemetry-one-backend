services:
  postgres:
    image: postgres:16-alpine
    container_name: telemetry-one-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
      POSTGRES_DB: telemetry_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry_one"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata-local:
